<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date et heure</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/script.js" async></script>
</head>
<body>
    <main>
    <fieldset id="dateDay"><legend>Date et heure du jour</legend>
    <div class="wrap">
        <label for="mydate" class="fixe">Date du jour</label>
        <input type="date" name="txtDate" id="txtDate">
        <button id="btnDate">Afficher Date</button>
        <!-- <input type="button" value="afficher Date" id="btnDate"> -->
    </div>
    <div class="wrap">
        <label for="myClock" class="fixe">Heure local</label>
        <input type="time" name="txtHeure" id="txtHeure">
        <button id="btnClock">Afficher heure</button>
    </div>
    </fieldset>
    </main>
</body>
</html>
