<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP Formulaire</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/script.js" type="module"></script>
</head>

<body>

    <main>
        <form id="info" method="get">
            <header>
                <h1>formulaire</h1>
            </header>
            <article class="info">

                <input type="text" name="prenom" id="prenom" placeholder="Prénom*" class="input " required>

                <input type="text" name="nom" id="nom" placeholder="Nom*" class="input" required>

                <input type="email" name="mail" id="email" placeholder="Email*" class="input long" required>

                <input type="tel" name="tel" id="tel" placeholder="Tel.*" class="input">

                <input type="text" name="civ" id="civ" placeholder="Société/Collectivité*" class="input">

                <textarea name="message" id="message" placeholder="Message" class="input long area" rows=""></textarea>

                <label for="question1" class="long">Comment avez-vous connus laboite ?</label>
                <select id="reponse1" name="question1" class="input long">
                    <option value="default">--merci de selectionner une option --</option>
                </select>

                <label for="question2" class="long">Vous êtes intéressés par :</label>
                <select id="reponse2" name="question2" class="input long">
                    <option value="default">-- merci de sélectionner une option --</option>
                </select>

                <label for="accept" class="long" id="labAccept"><input type="checkbox" name="accept" id="accept"
                        required>En cochant ce formulaire, vous autrisez <span></span> à utiliser vos données uniquement
                    dans le cadre du traitement de votre demande.Elles ne seront en aucun cas utilisées à autres fins
                    que celle de vous recontacter.</label>
                <button type="submit" id="btn-env">envoyer</button>

            </article>


        </form>
  

</body>

</html>
